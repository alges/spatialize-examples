# The gallery: one entry per notebook, in reading order. docs/conf.py reads it to copy the notebooks
# into the Sphinx tree and to write docs/index.md; docs/scripts/generate_thumbnails.py reads it to
# draw the thumbnails. Edit this file only; index.md is generated (and ignored by git).
#
# path: the notebook under examples/, without .ipynb; assets: sibling files the notebook shows.
# Only tracked notebooks belong here (work in progress stays out of the gallery).
intro: >-
  Worked examples and tutorials for the Spatialize library, grouped by topic. Each page is a
  runnable Jupyter notebook.
sections:
  - title: Getting started
    notebooks:
      - path: 01_getting_started/01_first_ensemble_map
        title: "A first ensemble map"
        description: "From scattered data to a map, its precision and the members behind both, on a grid and at scattered locations."
        assets: [ESI_procedure.png]
      - path: 01_getting_started/02_the_session
        title: "The session"
        description: "Settings for every call, which of them change only how a result is computed and which change the result."
  - title: Introductory
    notebooks:
      - path: introductory/ess_overview
        title: "ESS Overview"
        description: "A first look at Ensemble Spatial Simulation."
      - path: introductory/spa_overview
        title: "SPA Overview"
        description: "Introducing the spatial analysis utilities module."
  - title: Encoders and decoders
    notebooks:
      - path: 02_encoders_and_decoders/03_mondrian_and_voronoi
        title: "Encoders, Mondrian and Voronoi"
        description: "The cells of each partition process, the co-occurrence they give, and when the encoder changes the map."
      - path: 02_encoders_and_decoders/04_granularity_alpha_and_range
        title: "The granularity alpha and the range of the field"
        description: "Wide cells impose the partition's structure, narrow cells trace the field, and more partitions are a false cure."
      - path: 02_encoders_and_decoders/05_the_decoders
        title: "The decoders"
        description: "Averaging and drawing decoders side by side, judged by the map, the intervals and the atoms, and which to choose for what."
      - path: 02_encoders_and_decoders/06_cells_without_data
        title: "Cells without data"
        description: "The residual weight, and what nan, mark and coarsen say where the data do not reach."
  - title: Choosing an ensemble
    notebooks:
      - path: 03_choosing_an_ensemble/07_pareto_search
        title: "Choosing an ensemble with the Pareto search"
        description: "The encoder and decoder errors, the frontier between them, and which reading of it holds up against the truth."
  - title: ESI Fundamentals
    notebooks:
      - path: esi_fundamentals/esi_precision
        title: "Precision Metrics"
        description: "Understanding and customizing ESI precision/error metrics."
  - title: ESI Implementations
    notebooks:
      - path: esi_implementations/esi_2.5d
        title: "2.5D Interpolation"
        description: "Interpolating 2D spatial data with an elevation dimension."
      - path: esi_implementations/adaptive_esi_2d
        title: "Adaptive ESI (2D)"
        description: "Cell-by-cell parameter optimization for anisotropic 2D fields."
      - path: esi_implementations/adaptive_esi_2.5d
        title: "Adaptive ESI (2.5D)"
        description: "Adaptive ESI extended to 2D-plus-elevation data."
      - path: esi_implementations/categorical_esi
        title: "Categorical ESI"
        description: "Ensemble spatial interpolation for categorical/classification data."
  - title: How-To
    notebooks:
      - path: how_to/custom_esi_precision
        title: "Custom Precision Functions"
        description: "Defining and plugging in custom precision functions beyond the defaults."
  - title: Utilities
    notebooks:
      - path: utilities/empirical_tools
        title: "Empirical Tools"
        description: "Fitting and querying empirical probabilistic models over ensemble members."
      - path: utilities/evaluation_tools
        title: "Evaluation Tools"
        description: "Benchmarking helpers: synthetic scenarios, metrics, and baselines."
      - path: utilities/visualization_tools
        title: "Visualization Tools"
        description: "Themed plotting utilities for spatial data and results."
